name: chapter
description: "Chapter — your reading life, in one place."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, navigation, models
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.1.0
  firebase_app_check: ^0.5.1
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1

  # Local persistence
  drift: ^2.34.4
  drift_flutter: ^0.3.1

  # Utilities
  meta: ^1.17.0
  uuid: ^4.6.0
  intl: ^0.20.2
  connectivity_plus: ^7.3.2
  cached_network_image: ^3.4.1
  cloud_functions: ^7.0.1
  mobile_scanner: ^7.5.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  drift_dev: ^2.34.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  sqlite3: ^3.5.2
  path_provider_platform_interface: ^2.1.3

flutter:
  # iOS plugins come through Swift Package Manager, not CocoaPods: Firebase stops
  # publishing to CocoaPods from October 2026.
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  generate: true
  assets:
    - assets/images/chapter_logo.png
    - assets/legal/privacy_policy.md
    - assets/fonts/OFL-Newsreader.txt
    - assets/fonts/OFL-PlusJakartaSans.txt
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader_400.ttf
          weight: 400
        - asset: assets/fonts/Newsreader_400Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Newsreader_500.ttf
          weight: 500
        - asset: assets/fonts/Newsreader_600.ttf
          weight: 600
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans_500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans_600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans_700.ttf
          weight: 700
