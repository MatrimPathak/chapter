# Sized for an 8 GB development machine that also runs the Android and
# Firebase emulators (the Flutter template's -Xmx8G got the daemon killed).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# The project and the pub cache can be on different drives on Windows, which
# breaks Kotlin's incremental caches ("different roots") and fails builds at random.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
